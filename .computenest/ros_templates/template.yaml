ROSTemplateFormatVersion: '2015-09-01'
Conditions:
  CreateVpcConditions:
    Fn::Equals:
      - NewVPC
      - Ref: VpcOption
  IfAllocatePublicIP:
    Fn::Equals:
      - true
      - Ref: AllocatePublicIP
Parameters:
  VpcOption:
    Type: String
    AllowedValues:
      - NewVPC
      - ExistingVPC
    AssociationPropertyMetadata:
      ValueLabelMapping:
        NewVPC:
          zh-cn: 新建专有网络
          en: New VPC
        ExistingVPC:
          zh-cn: 已有专有网络
          en: Existing VPC
    Label:
      en: Select Existing or New VPC
      zh-cn: 选择已有/新建的专有网络
    Required: true
    Default: NewVPC
  VpcCidrBlock:
    Type: String
    Label:
      en: VPC CIDR IPv4 Block
      zh-cn: 专有网络IPv4网段
    Description:
      zh-cn: VPC的ip地址段范围，<br>您可以使用以下的ip地址段或其子网:<br><font color='green'>[10.0.0.0/8]</font><br><font color='green'>[172.16.0.0/12]</font><br><font color='green'>[192.168.0.0/16]</font>
      en: 'The ip address range of the VPC in the CidrBlock form; <br>You can use the following ip address ranges and their subnets: <br><font color=''green''>[10.0.0.0/8]</font><br><font color=''green''>[172.16.0.0/12]</font><br><font color=''green''>[192.168.0.0/16]</font>'
    Default: 192.168.0.0/16
    Required:
      Fn::Equals:
        - NewVPC
        - ${VpcOption}
    AssociationProperty: ALIYUN::VPC::VPC::CidrBlock
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - NewVPC
            - ${VpcOption}
  VSwitchCidrBlock:
    Type: String
    Label:
      en: VSwitch CIDR Block
      zh-cn: 交换机子网网段
    Description:
      zh-cn: 必须属于VPC的子网段。
      en: Must belong to the subnet segment of VPC.
    Default: 192.168.1.0/24
    Required:
      Fn::Equals:
        - NewVPC
        - ${VpcOption}
    AssociationProperty: ALIYUN::VPC::VSwitch::CidrBlock
    AssociationPropertyMetadata:
      VpcCidrBlock: VpcCidrBlock
      Visible:
        Condition:
          Fn::Equals:
            - NewVPC
            - ${VpcOption}
  ZoneId:
    Type: String
    Label:
      en: Zone ID
      zh-cn: 可用区ID
    AssociationProperty: ALIYUN::ECS::Instance::ZoneId
    AssociationPropertyMetadata:
      DefaultValueStrategy: random
      InstanceChargeType: ${PayType}
      SystemDiskCategory: cloud_essd
      InstanceType: ${EcsInstanceType}
  VpcId:
    Type: String
    Label:
      en: VPC ID
      zh-cn: 专有网络VPC实例ID
    AssociationProperty: 'ALIYUN::ECS::VPC::VPCId'
    Required:
      Fn::Equals:
        - ExistingVPC
        - ${VpcOption}
    Default: ''
    AssociationPropertyMetadata:
      AutoSelectFirst: true
      Visible:
        Condition:
          Fn::Equals:
            - ExistingVPC
            - ${VpcOption}
  VSwitchId:
    Type: String
    Label:
      en: VSwitch ID
      zh-cn: 交换机实例ID
    Default: ''
    AssociationProperty: 'ALIYUN::ECS::VSwitch::VSwitchId'
    Required:
      Fn::Equals:
        - ExistingVPC
        - ${VpcOption}
    AssociationPropertyMetadata:
      AutoSelectFirst: true
      VpcId: ${VpcId}
      ZoneId: ${ZoneId}
      Visible:
        Condition:
          Fn::Equals:
            - ExistingVPC
            - ${VpcOption}
  PayType:
    Type: String
    Label:
      en: ECS Instance Charge Type
      zh-cn: 付费类型
    Default: PostPaid
    AllowedValues:
      - PostPaid
      - PrePaid
    AssociationProperty: ChargeType
    AssociationPropertyMetadata:
      LocaleKey: InstanceChargeType
  PayPeriodUnit:
    Type: String
    Label:
      en: Pay Period Unit
      zh-cn: 购买资源时长周期
    Default: Month
    AllowedValues:
      - Month
      - Year
    AssociationProperty: PayPeriodUnit
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - ${PayType}
              - PostPaid
  PayPeriod:
    Type: Number
    Label:
      en: Period
      zh-cn: 购买资源时长
    Default: 1
    AllowedValues:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      - 9
    AssociationProperty: PayPeriod
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - ${PayType}
              - PostPaid
  EcsInstanceType:
    Type: String
    Label:
      en: Instance Type
      zh-cn: 实例类型
    AssociationProperty: ALIYUN::ECS::Instance::InstanceType
    AssociationPropertyMetadata:
      InstanceChargeType: ${PayType}
      Constraints:
        InstanceTypeFamily:
          - ecs.u1
          - ecs.e
  InstancePassword:
    NoEcho: true
    Type: String
    Description:
      en: Server login password, Length 8-30, must contain three(Capital letters, lowercase letters, numbers, ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/ Special symbol in)
      zh-cn: 服务器登录密码,长度8-30，必须包含三项（大写字母、小写字母、数字、 ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/ 中的特殊符号）
    AllowedPattern: '^[a-zA-Z0-9-\(\)\`\~\!\@\#\$\%\^\&\*\_\-\+\=\|\{\}\[\]\:\;\<\>\,\.\?\/]*$'
    Label:
      en: Instance Password
      zh-cn: 实例密码
    ConstraintDescription:
      en: Length 8-30, must contain three(Capital letters, lowercase letters, numbers, ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/ Special symbol in)
      zh-cn: 长度8-30，必须包含三项（大写字母、小写字母、数字、 ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/ 中的特殊符号）
    MinLength: 8
    MaxLength: 30
    AssociationProperty: ALIYUN::ECS::Instance::Password
  SystemDiskSize:
    Default: 40
    Type: Number
    Description:
      zh-cn: 系统盘大小, 取值范围：[40, 500], 单位：GB。
      en: 'System disk size of each node, range of values: 40-500, units: GB.'
    MinValue: 40
    MaxValue: 500
    Label:
      zh-cn: 系统盘空间
      en: System Disk Space
  DataDiskSize:
    Default: 40
    Type: Number
    Description:
      zh-cn: 数据盘大小, 取值范围：[40, 500], 单位：GB。Neo4j数据将自动写入该磁盘。
      en: 'Data disk size, range of values: 40-500 GB. Neo4j data is stored on this disk automatically.'
    MinValue: 40
    MaxValue: 500
    Label:
      zh-cn: 数据盘空间
      en: Data Disk Space
  AllocatePublicIP:
    Type: Boolean
    Label:
      en: Allocate Public IP
      zh-cn: 是否分配公网IP
    Default: true
    AssociationPropertyMetadata:
      ValueLabelMapping:
        true:
          zh-cn: 是
          en: 'Yes'
        false:
          zh-cn: 否
          en: 'No'
  Neo4jPassword:
    NoEcho: true
    Type: String
    Description:
      en: Neo4j server login password, Length 8-30, must contain three(Capital letters, lowercase letters, numbers, ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/ Special symbol in)
      zh-cn: Neo4j服务登录密码,长度8-30，必须包含三项（大写字母、小写字母、数字、 ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/ 中的特殊符号）
    AllowedPattern: '^[a-zA-Z0-9-\(\)\`\~\!\@\#\$\%\^\&\*\_\-\+\=\|\{\}\[\]\:\;\<\>\,\.\?\/]*$'
    Label:
      en: Server Password
      zh-cn: Neo4j服务密码
    ConstraintDescription:
      en: Length 8-30, must contain three(Capital letters, lowercase letters, numbers, ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/ Special symbol in)
      zh-cn: 长度8-30，必须包含三项（大写字母、小写字母、数字、 ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/ 中的特殊符号）
    MinLength: 8
    MaxLength: 30
    AssociationProperty: ALIYUN::ECS::Instance::Password
Resources:
  # 新建vpc
  EcsVpc:
    Type: ALIYUN::ECS::VPC
    Condition: CreateVpcConditions
    Properties:
      VpcName:
        Ref: ALIYUN::StackName
      CidrBlock:
        Ref: VpcCidrBlock
  # 新建vswitch
  EcsVSwitch:
    Condition: CreateVpcConditions
    Type: ALIYUN::ECS::VSwitch
    Properties:
      VSwitchName:
        Ref: ALIYUN::StackName
      VpcId:
        Ref: EcsVpc
      ZoneId:
        Ref: ZoneId
      CidrBlock:
        Ref: VSwitchCidrBlock
  SecurityGroup:
    Type: ALIYUN::ECS::SecurityGroup
    Properties:
      SecurityGroupName:
        Ref: ALIYUN::StackName
      VpcId:
        Fn::If:
          - CreateVpcConditions
          - Ref: EcsVpc
          - Ref: VpcId
      SecurityGroupIngress:
        - PortRange: 7474/7474
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 7687/7687
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
  InstanceGroup:
    Type: ALIYUN::ECS::InstanceGroup
    Properties:
      # 付费类型
      InstanceChargeType:
        Ref: PayType
      PeriodUnit:
        Ref: PayPeriodUnit
      Period:
        Ref: PayPeriod
      VpcId:
        Fn::If:
          - CreateVpcConditions
          - Ref: EcsVpc
          - Ref: VpcId
      VSwitchId:
        Fn::If:
          - CreateVpcConditions
          - Ref: EcsVSwitch
          - Ref: VSwitchId
      ZoneId:
        Ref: ZoneId
      SecurityGroupId:
        Ref: SecurityGroup
      ImageId: centos_7_9_x64_20G_alibase_20240403.vhd
      Password:
        Ref: InstancePassword
      InstanceType:
        Ref: EcsInstanceType
      SystemDiskCategory: cloud_essd
      SystemDiskSize:
        Ref: SystemDiskSize
      DiskMappings:
        - Category: cloud_essd
          Size:
            Ref: DataDiskSize
      InternetMaxBandwidthOut:
        Fn::If:
          - IfAllocatePublicIP
          - 5
          - 0
      IoOptimized: optimized
      MaxAmount: 1
      AllocatePublicIP:
        Fn::If:
          - IfAllocatePublicIP
          - true
          - false
  RunInstallCommand:
    Type: ALIYUN::ECS::RunCommand
    Properties:
      InstanceIds:
        Fn::GetAtt:
        - InstanceGroup
        - InstanceIds
      Type: RunShellScript
      Sync: true
      Timeout: 3600
      CommandContent:
        Fn::Sub:
          - |-
            #!/bin/bash
            set -Eeuo pipefail
            cd /usr/local/applications/
            docker compose down || true

            # 识别系统盘之外的数据盘，兼容 virtio 和 NVMe 设备名。
            DATA_DIR=/data
            ROOT_SOURCE=$(findmnt -n -o SOURCE /)
            ROOT_PARENT=$(lsblk -no PKNAME "$ROOT_SOURCE" | head -n 1 || true)
            if [ -n "$ROOT_PARENT" ]; then
              ROOT_DISK="/dev/$ROOT_PARENT"
            else
              ROOT_DISK="$ROOT_SOURCE"
            fi
            DATA_DISK=$(lsblk -dnpo NAME,TYPE | awk '$2 == "disk" {print $1}' | grep -vx "$ROOT_DISK" | head -n 1 || true)
            if [ -z "$DATA_DISK" ]; then
              echo "未找到系统盘之外的数据盘，停止部署以避免数据写入系统盘。"
              exit 1
            fi

            # 已有分区时使用首个分区；全新裸盘直接格式化为 ext4。
            DATA_DEVICE=$(lsblk -nrpo NAME,TYPE "$DATA_DISK" | awk '$2 == "part" {print $1; exit}')
            if [ -z "$DATA_DEVICE" ]; then
              DATA_DEVICE="$DATA_DISK"
            fi
            FILESYSTEM=$(blkid -s TYPE -o value "$DATA_DEVICE" 2>/dev/null || true)
            if [ -z "$FILESYSTEM" ]; then
              mkfs.ext4 -F "$DATA_DEVICE"
              FILESYSTEM=ext4
            fi

            mkdir -p "$DATA_DIR"
            UUID=$(blkid -s UUID -o value "$DATA_DEVICE")
            if ! mountpoint -q "$DATA_DIR"; then
              grep -q "UUID=$UUID" /etc/fstab || echo "UUID=$UUID $DATA_DIR $FILESYSTEM defaults,nofail 0 2" >> /etc/fstab
              mount "$DATA_DIR"
            fi
            if [ "$(findmnt -n -o UUID "$DATA_DIR")" != "$UUID" ]; then
              echo "$DATA_DIR 未挂载到目标数据盘，停止部署。"
              exit 1
            fi

            # 将镜像中可能存在的历史目录迁移至数据盘。
            for directory in data logs config; do
              mkdir -p "$DATA_DIR/neo4j/$directory"
              cp -a "/root/neo4j/$directory/." "$DATA_DIR/neo4j/$directory/" 2>/dev/null || true
            done
            mkdir -p "$DATA_DIR/neo4j/plugins"
            cp -a /root/neo4j/plugin/. "$DATA_DIR/neo4j/plugins/" 2>/dev/null || true

            # 按实例实际内存计算：堆使用一半且不超过 31 GiB，页缓存使用剩余内存的 60%。
            MEM_MB=$(awk '/MemTotal/ {printf "%d", $2/1024}' /proc/meminfo)
            HEAP_MB=$((MEM_MB / 2))
            if [ "$HEAP_MB" -gt 31744 ]; then HEAP_MB=31744; fi
            if [ "$HEAP_MB" -lt 512 ]; then HEAP_MB=512; fi
            PAGECACHE_MB=$(((MEM_MB - HEAP_MB) * 60 / 100))
            if [ "$PAGECACHE_MB" -lt 512 ]; then PAGECACHE_MB=512; fi

            cat > ./docker-compose.yml <<COMPOSE
            services:
              neo4j:
                image: neo4j:latest
                volumes:
                  - $DATA_DIR/neo4j/logs:/logs
                  - $DATA_DIR/neo4j/config:/config
                  - $DATA_DIR/neo4j/data:/data
                  - $DATA_DIR/neo4j/plugins:/plugins
                environment:
                  - NEO4J_AUTH_FILE=/run/secrets/neo4j_auth_file
                  - NEO4J_server_memory_heap_initial__size=${!HEAP_MB}m
                  - NEO4J_server_memory_heap_max__size=${!HEAP_MB}m
                  - NEO4J_server_memory_pagecache_size=${!PAGECACHE_MB}m
                ports:
                  - "7474:7474"
                  - "7687:7687"
                restart: unless-stopped
                secrets:
                  - neo4j_auth_file
            secrets:
              neo4j_auth_file:
                file: ./neo4j_auth.txt
            COMPOSE

            cat > ./neo4j_auth.txt <<'EOF'
            neo4j/${Neo4jPassword}
            EOF
            docker compose up -d

            # 只有 Neo4j HTTP 服务真正就绪后才完成部署。
            for attempt in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:7474 >/dev/null; then
                echo "Neo4j 已就绪，数据目录：$DATA_DIR/neo4j/data，heap=${!HEAP_MB}m，pagecache=${!PAGECACHE_MB}m。"
                exit 0
              fi
              sleep 5
            done
            docker compose logs --tail=200
            exit 1
          - Neo4jPassword:
              Ref: Neo4jPassword

Outputs:
  # 将内网ip做为http返回的地址显示在控制台
  PrivateEndpoint:
    Description:
      zh-cn: 内网IP地址
      en: Private IP Addresses
    Value:
      Fn::Sub:
        - http://${ServerAddress}:7474
        - ServerAddress:
            Fn::Select:
              - 0
              - Fn::GetAtt:
                 - InstanceGroup
                 - PrivateIps
  # 将公网ip做为http返回的地址显示在控制台
  PublicEndpoint:
    Condition: IfAllocatePublicIP
    Description:
      zh-cn: 公网IP地址
      en: Public IP Addresses
    Value:
      Fn::Sub:
        - http://${ServerAddress}:7474
        - ServerAddress:
            Fn::Select:
              - 0
              - Fn::GetAtt:
                  - InstanceGroup
                  - PublicIps
  Neo4jUserName:
    Description:
      zh-cn: Neo4j用户名
      en: Neo4j User Name
    Value: neo4j
  DataPath:
    Description:
      zh-cn: Neo4j数据目录
      en: Neo4j Data Path
    Value: /data/neo4j/data
Metadata:
  ALIYUN::ROS::Interface:
    ParameterGroups:
      - Parameters:
          - PayType
          - PayPeriodUnit
          - PayPeriod
        Label:
          default: 付费类型配置
      - Parameters:
          - AllocatePublicIP
          - EcsInstanceType
          - InstancePassword
          - SystemDiskSize
          - DataDiskSize
        Label:
          default: 资源配置
      - Parameters:
          - Neo4jPassword
        Label:
          default: Neo4j配置
      - Parameters:
          - ZoneId
          - VpcOption
          - VpcId
          - VSwitchId
          - VpcCidrBlock
          - VSwitchCidrBlock
        Label:
          default: 可用区配置
